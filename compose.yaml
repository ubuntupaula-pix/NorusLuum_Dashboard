# PostgreSQL interno sin TLS: la cadena incluye sslmode=disable para que
# app.database no exija SSL. Para usar PostgreSQL en la nube emplea
# compose.cloud.yaml con DATABASE_URL en .env.
x-internal-db-url: &internal-db-url "postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable"

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB en .env}
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Genera un secreto PostgreSQL en .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks: [backend]

  # Migraciones idempotentes antes de arrancar la API.
  # Si defines DATABASE_URL en .env (PostgreSQL en la nube) se usa esa cadena;
  # si está vacía se usa el PostgreSQL interno sin TLS.
  migrate:
    build: .
    environment:
      NORUS_ENV: production
      DATABASE_URL: *internal-db-url
      NORUS_DB_SSLMODE: ${NORUS_DB_SSLMODE:-require}
      NORUS_DB_CONNECT_TIMEOUT: ${NORUS_DB_CONNECT_TIMEOUT:-10}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks: [backend]

  api:
    build: .
    environment:
      NORUS_ENV: production
      NORUS_PUBLIC_URL: ${NORUS_PUBLIC_URL:?Define NORUS_PUBLIC_URL en .env}
      NORUS_JWT_SECRET: ${NORUS_JWT_SECRET:?Genera un secreto JWT en .env}
      # Obligatoria en producción: cifra datos personales en reposo.
      NORUS_ENCRYPTION_KEY: ${NORUS_ENCRYPTION_KEY:?Genera una clave Fernet en .env}
      NORUS_TOKEN_EXPIRY: ${NORUS_TOKEN_EXPIRY:-30}
      NORUS_PASSWORD_MIN_LENGTH: ${NORUS_PASSWORD_MIN_LENGTH:-12}
      NORUS_COOKIE_SECURE: ${NORUS_COOKIE_SECURE:-true}
      NORUS_JWT_ISSUER: ${NORUS_JWT_ISSUER:-norus-intelligence}
      NORUS_JWT_AUDIENCE: ${NORUS_JWT_AUDIENCE:-norus-dashboard}
      NORUS_UPLOAD_MAX_BYTES: ${NORUS_UPLOAD_MAX_BYTES:-536870912}
      NORUS_IMPORT_MAX_ROWS: ${NORUS_IMPORT_MAX_ROWS:-1000000}
      NORUS_MARKET_IMPORT_MAX_BYTES: ${NORUS_MARKET_IMPORT_MAX_BYTES:-536870912}
      NORUS_DEFAULT_CURRENCY: ${NORUS_DEFAULT_CURRENCY:-CLP}
      NORUS_CORS_ORIGINS: ${NORUS_CORS_ORIGINS:-}
      # SSO / OIDC opcional: si NORUS_SSO_ISSUER está vacío se desactiva.
      NORUS_SSO_ISSUER: ${NORUS_SSO_ISSUER:-}
      NORUS_SSO_CLIENT_ID: ${NORUS_SSO_CLIENT_ID:-}
      NORUS_SSO_CLIENT_SECRET: ${NORUS_SSO_CLIENT_SECRET:-}
      NORUS_SSO_REDIRECT_URI: ${NORUS_SSO_REDIRECT_URI:-}
      NORUS_SSO_SCOPES: ${NORUS_SSO_SCOPES:-openid email profile}
      DATABASE_URL: *internal-db-url
      NORUS_DB_SSLMODE: ${NORUS_DB_SSLMODE:-require}
      NORUS_DB_CONNECT_TIMEOUT: ${NORUS_DB_CONNECT_TIMEOUT:-10}
      NORUS_DB_POOL_SIZE: ${NORUS_DB_POOL_SIZE:-10}
      NORUS_DB_MAX_OVERFLOW: ${NORUS_DB_MAX_OVERFLOW:-20}
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose: ["8765"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    restart: unless-stopped
    networks: [backend, edge]

  backup:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB en .env}
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Genera un secreto PostgreSQL en .env}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        export PGPASSWORD="$$POSTGRES_PASSWORD"
        while true; do
          stamp=$$(date -u +%Y%m%dT%H%M%SZ)
          pg_dump --host=db --username="$$POSTGRES_USER" --dbname="$$POSTGRES_DB" --format=custom --file="/backups/norus_$$stamp.dump"
          find /backups -type f -name 'norus_*.dump' -mtime +"$$BACKUP_RETENTION_DAYS" -delete
          sleep 86400
        done
    volumes:
      - backup_data:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks: [backend]

  proxy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:?Define un dominio público en .env}
      ACME_EMAIL: ${ACME_EMAIL:?Define el correo de administración TLS en .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
    restart: unless-stopped
    networks: [edge]

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  backup_data:

networks:
  backend:
    internal: true
    ipam:
      config: [{subnet: 172.28.0.0/24}]
  edge:
    ipam:
      config: [{subnet: 172.29.0.0/24}]
