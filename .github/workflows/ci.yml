name: Validación y construcción

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Instalar dependencias y herramientas de validación
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-cov httpx
      - name: Compilar Python y ejecutar suite
        run: |
          python -m compileall -q app scripts
          pytest -q --cov=app --cov-report=term-missing
      - name: Validar sintaxis JavaScript
        run: |
          for file in js/*.js data/*.js; do node --check "$file"; done

  build:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Validar Docker Compose
        env:
          POSTGRES_DB: norus_ci
          POSTGRES_USER: norus_ci
          POSTGRES_PASSWORD: ci-only-placeholder-not-for-deployment
          NORUS_JWT_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
          DOMAIN: localhost
          ACME_EMAIL: ci@example.invalid
        run: docker compose config --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: norus-intelligence-platform:ci
